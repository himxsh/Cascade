name: Cascade

# Live DataHub only — fails closed if DATAHUB_GMS_URL is unset or unreachable.
# Pin cascade-agent to a tag/commit when you install from git.

on:
  pull_request:
    paths:
      - "**/*.sql"
      - "**/models/**"
      - "**/schema.yml"
      - "**/schema.yaml"
      - ".cascade/config.json"
      - ".github/workflows/cascade.yml"

jobs:
  pr-impact:
    if: >
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'cascade/remediation/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require live DataHub secret
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
        run: |
          if [ -z "${DATAHUB_GMS_URL:-}" ]; then
            echo "::error::DATAHUB_GMS_URL secret is required (HTTPS GMS; runners cannot see localhost)."
            exit 1
          fi

      - name: Install Cascade
        run: |
          pip install "cascade-agent[writeback] @ git+https://github.com/himxsh/Cascade.git@74e491aa6f8c689faa56ad5439f3a254a8ab3d72"

      - name: Compute PR diff
        id: diff
        run: |
          mkdir -p artifacts/pr
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(
            git diff --name-only "${BASE}...${HEAD}" \
              | grep -E '\.sql$|(^|/)models/|schema\.ya?ml$' || true
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No SQL/model/schema changes; skipping."
            : > artifacts/pr/pr.diff
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            git diff "${BASE}...${HEAD}" -- "${FILES[@]}" > artifacts/pr/pr.diff
            wc -l artifacts/pr/pr.diff
          fi

      - name: Impact + generate (live)
        if: steps.diff.outputs.empty != 'true'
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          CASCADE_MODE: ${{ vars.CASCADE_MODE }}
          CASCADE_LLM_PROVIDER: ${{ vars.CASCADE_LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          CASCADE_WRITEBACK: ${{ secrets.CASCADE_WRITEBACK }}
        run: |
          cascade impact \
            --diff artifacts/pr/pr.diff \
            --source live \
            --generate \
            --out artifacts/pr/generate \
            > artifacts/pr/impact_stdout.json

      - name: Apply (comment + remediation PR)
        if: steps.diff.outputs.empty != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CASCADE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CASCADE_OPEN_DOWNSTREAM_PR: "1"
          CASCADE_DOWNSTREAM_BASE: ${{ github.event.pull_request.base.ref }}
          CASCADE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          CASCADE_WRITEBACK: ${{ secrets.CASCADE_WRITEBACK }}
        run: |
          cascade apply \
            --report artifacts/pr/generate/impact_report.json \
            --out artifacts/pr/apply \
            --mode apply \
            --require-policy \
            --pr-number "${{ github.event.pull_request.number }}"

      - name: Upload artifacts
        if: steps.diff.outputs.empty != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cascade-pr
          path: artifacts/pr/
