# Calls Cascade's reusable workflow; secrets stay in your repository.
name: Cascade

on:
  pull_request:
    paths:
      - "**/*.sql"
      - "**/models/**"
      - "**/schema.yml"
      - "**/schema.yaml"
      - ".cascade/config.json"
      - ".github/workflows/cascade.yml"
  issue_comment:
    types: [created]

jobs:
  cascade:
    permissions:
      contents: write
      pull-requests: write
    uses: himxsh/Cascade/.github/workflows/run.yml@v0.3.0
    with:
      cascade-version: "0.3.0"
    secrets: inherit
