name: Release check

# A PR that changes the shipped package must raise cascade.__version__,
# so publish.yml releases it on merge. Label the PR `no-release` to skip.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  version-bump:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: cascade/ changes need a version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- cascade/ pyproject.toml; then
            echo "No package changes; no release needed."
            exit 0
          fi
          read_version() { sed -n 's/^__version__ = "\(.*\)"$/\1/p'; }
          old=$(git show "${BASE}:cascade/__init__.py" | read_version)
          new=$(read_version < cascade/__init__.py)
          echo "base: $old  this PR: $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=cascade/__init__.py::This PR changes the package but __version__ is still $old. Bump it, or add the no-release label."
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)
          if [ "$highest" != "$new" ]; then
            echo "::error file=cascade/__init__.py::__version__ went from $old to $new. It must go up."
            exit 1
          fi
