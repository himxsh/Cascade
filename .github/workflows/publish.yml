name: Publish to PyPI

# Bump `version` in pyproject.toml (and cascade/__init__.py), merge to main,
# and this uploads it. Versions already on PyPI are skipped, so other merges
# that touch pyproject.toml are no-ops.
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/publish.yml]
  workflow_dispatch:

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cascade-bot/$version/json")
          if [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "cascade-bot $version is not on PyPI yet; publishing."
          elif [ "$status" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "cascade-bot $version is already on PyPI; nothing to do."
          else
            echo "PyPI returned HTTP $status for $version" >&2
            exit 1
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cascade-bot/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write  # PyPI Trusted Publishing; no API token stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install -e ".[ui]"
          python -m unittest discover -s tests
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/cascade --version | grep -F "${{ needs.check.outputs.version }}"
          /tmp/smoke/bin/cascade setup --help > /dev/null
      - uses: pypa/gh-action-pypi-publish@release/v1
