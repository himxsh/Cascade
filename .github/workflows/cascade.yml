name: Cascade Act

# fixture-ci: offline golden path (hardcoded example diff) — no GMS secrets needed.
# pr-impact: real PR base…head SQL/model/schema diff → impact + remediation PR + comment.
# Live GMS when DATAHUB_GMS_URL secret is set; else --source auto falls back to fixture.

on:
  pull_request:
    paths:
      - "**/*.sql"
      - "**/models/**"
      - "**/schema.yml"
      - "**/schema.yaml"
      - "examples/diffs/**"
      - ".cascade/config.json"
      - "cascade/**"
      - ".github/workflows/cascade.yml"
  workflow_dispatch:
  push:
    paths:
      - "examples/diffs/**"
      - "examples/models/**"
      - "cascade/**"
      - ".cascade/config.json"
      - ".github/workflows/cascade.yml"

jobs:
  fixture-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Impact + generate (fixture)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          mkdir -p artifacts/fixture
          cascade impact \
            --diff examples/diffs/raw_orders_rename_user_id.json \
            --source fixture \
            --generate --models-dir examples/models \
            --out artifacts/fixture > artifacts/fixture/impact_stdout.json
      - name: Apply dry-run
        run: |
          cascade apply \
            --report artifacts/fixture/impact_report.json \
            --out artifacts/fixture/apply \
            --mode dry-run \
            --mark-migrated
      - name: Upload fixture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cascade-fixture
          path: artifacts/fixture/

  pr-impact:
    # Skip Cascade's own remediation PRs (avoid feedback loops).
    if: >
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'cascade/remediation/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Compute PR diff
        id: diff
        run: |
          mkdir -p artifacts/pr
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(
            git diff --name-only "${BASE}...${HEAD}" \
              | grep -E '\.sql$|(^|/)models/|schema\.ya?ml$' || true
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No SQL/model/schema changes in PR; skipping impact."
            : > artifacts/pr/pr.diff
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            git diff "${BASE}...${HEAD}" -- "${FILES[@]}" > artifacts/pr/pr.diff
            wc -l artifacts/pr/pr.diff
          fi
      - name: Impact + generate (PR diff)
        if: steps.diff.outputs.empty != 'true'
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_TOKEN: ${{ secrets.DATAHUB_TOKEN }}
          CASCADE_SOURCE_URN: ${{ vars.CASCADE_SOURCE_URN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          if [ -n "${DATAHUB_GMS_URL:-}" ]; then
            SOURCE=live
          else
            SOURCE=auto
          fi
          cascade impact \
            --diff artifacts/pr/pr.diff \
            --source "$SOURCE" \
            --generate \
            --out artifacts/pr/generate \
            > artifacts/pr/impact_stdout.json
      - name: Apply (comment + remediation PR)
        if: steps.diff.outputs.empty != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CASCADE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CASCADE_OPEN_DOWNSTREAM_PR: "1"
          CASCADE_DOWNSTREAM_BASE: ${{ github.event.pull_request.base.ref }}
          CASCADE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: |
          cascade apply \
            --report artifacts/pr/generate/impact_report.json \
            --out artifacts/pr/apply \
            --mode apply \
            --require-policy \
            --pr-number "${{ github.event.pull_request.number }}"
      - name: Upload PR artifacts
        if: steps.diff.outputs.empty != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cascade-pr
          path: artifacts/pr/
